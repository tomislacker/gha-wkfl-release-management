---
# Dependabot has no pre-commit ecosystem, so hook revisions are refreshed by this
# scheduled job instead: run `pre-commit autoupdate` and, if anything moved, push a
# topic branch and open (or refresh) a pull request that rides the normal CI gate.
name: Pre-commit Autoupdate

on:
  schedule:
    # Mondays 09:17 UTC -- offset from the top of the hour to dodge the cron rush.
    - cron: '17 9 * * 1'
  workflow_dispatch:

# Least privilege: nothing is granted by default, only the autoupdate job asks.
permissions: {}

concurrency:
  group: pre-commit-autoupdate
  cancel-in-progress: false

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the update branch
      pull-requests: write  # open or refresh the pull request
    env:
      BRANCH: ci/pre-commit-autoupdate
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run pre-commit autoupdate
        run: |
          pip install pre-commit
          pre-commit autoupdate

      - name: Push a branch and open a pull request if hooks moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "hooks already current"
            exit 0
          fi
          # Runner-local identity for the automation commit; commits made here are
          # attributed to the github-actions bot, matching release-please's PRs.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add .pre-commit-config.yaml
          git commit -m "ci(deps): update pre-commit hooks"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --head "$BRANCH" \
              --title "ci(deps): update pre-commit hooks" \
              --body "Automated \`pre-commit autoupdate\`. Review the moved revisions before merging."
          else
            echo "pull request already open; branch refreshed"
          fi
