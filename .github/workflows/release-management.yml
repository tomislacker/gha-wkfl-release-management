---
# Reusable release-management workflow.
#
# Runs release-please (conventional commits -> version bump, changelog, release
# PR, GitHub release) and, whenever a release is actually cut, force-moves the
# floating major/minor tags (v1, v1.2) onto the new release commit.
#
# The CALLING workflow must grant:
#   permissions:
#     contents: write        # create releases and push floating tags
#     pull-requests: write   # open/update the release PR
#
# Concurrency is deliberately not set here -- it belongs to the caller, which
# knows how its own release pushes should serialize.
name: Release management

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the release-please config file.
        required: false
        type: string
        default: release-please-config.json
      manifest-file:
        description: Path to the release-please manifest file.
        required: false
        type: string
        default: .release-please-manifest.json
      target-branch:
        description: Branch to release from. Empty means the repository default branch.
        required: false
        type: string
        default: ""
      dry-run:
        description: Compute and log the floating tag moves without pushing them.
        required: false
        type: boolean
        default: false
    secrets:
      token:
        description: >-
          Personal access token used instead of github.token. Supply one if the
          release PR needs to trigger other workflows, since events produced by
          github.token do not start new workflow runs.
        required: false
    outputs:
      release_created:
        description: Set to the string "true" when release-please cut a release on this run.
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag of the release that was created, if any.
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: Version of the release that was created, if any.
        value: ${{ jobs.release-please.outputs.version }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release commit, tag and GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}

  floating-tags:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-push the floating major/minor tags
    steps:
      # The github context inside a reusable workflow refers to the caller, so
      # this checks out the consumer repository -- the one whose tags move.
      # Credentials are persisted on purpose: the script pushes with them.
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.token || github.token }}

      # job.workflow_sha / job.workflow_repository identify the reusable workflow's own
      # source (added by GitHub Sept 2026; not available on GHES). Validate fail-closed:
      # if either is missing, actions/checkout would silently fall back to this
      # repository's default branch, executing unpinned code on the consumer's runner.
      - name: Resolve the tools source
        id: tools
        env:
          TOOLS_REPO: ${{ job.workflow_repository }}
          TOOLS_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! $TOOLS_SHA =~ ^[0-9a-f]{40}$ ]]; then
            printf 'error: job.workflow_sha is %q, not a 40-char SHA; refusing mutable fallback\n' "$TOOLS_SHA" >&2
            exit 1
          fi
          if [[ ! $TOOLS_REPO =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            printf 'error: job.workflow_repository is %q, not an owner/repo slug\n' "$TOOLS_REPO" >&2
            exit 1
          fi
          printf 'repo=%s\nsha=%s\n' "$TOOLS_REPO" "$TOOLS_SHA" >>"$GITHUB_OUTPUT"

      # Fetch the scripts from the exact commit of this reusable workflow, so the
      # logic always matches the ref the consumer pinned. Resolving the slug rather
      # than hardcoding it also keeps forks checking out their own copy.
      - name: Check out the release-management tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.tools.outputs.repo }}
          ref: ${{ steps.tools.outputs.sha }}
          path: .release-management-tools
          persist-credentials: false

      - name: Move floating tags
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: .release-management-tools/scripts/move-floating-tags.sh
