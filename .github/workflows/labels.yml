---
name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
  workflow_dispatch:

# Least privilege: nothing is granted by default, only the labeler job asks.
permissions: {}

concurrency:
  group: labels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  labeler:
    name: Apply .github/labels.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read # read .github/labels.yml
      issues: write # create, update and delete labels
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: false
          dry-run: false
