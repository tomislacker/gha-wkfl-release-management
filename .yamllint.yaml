---
# yamllint configuration for gha-wkfl-release-management.
# Line-length policy for the whole repository is 120 columns.
extends: default

rules:
  line-length:
    max: 120
    level: error
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # GitHub Actions workflows use the `on:` key, which YAML 1.1 treats as a
  # boolean. Only check values, never keys, so `on:` stays unquoted.
  truthy:
    check-keys: false
    allowed-values: ['true', 'false']

  document-start:
    present: true

  # Action pins are annotated as `uses: owner/repo@<sha> # vX.Y.Z`, i.e. a
  # single space before the trailing comment.
  comments:
    require-starting-space: true
    min-spaces-from-content: 1

  comments-indentation: enable

  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  empty-values:
    forbid-in-block-mappings: false
    forbid-in-flow-mappings: true

  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
